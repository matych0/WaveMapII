name: "egm_resnet_gnn"

model_class: "src.model.egm_graph_nn.ResNetEdgeConvGNN"

hparams:
  proj_dim: 32
  use_handcrafted: true
  use_coords: true

  resnet:
    dim: 1
    in_features: 1
    kernel_size: 5
    stem_kernel_size: 17
    blocks: [1, 1, 1, 1]
    features: [16, 32, 64, 128]
    activation: "LReLU"
    downsampling_factor: 2
    normalization: "BatchN"
    preactivation: false

  gnn:
    conv_channels: [16, 32]
    embedding_dims: [128]
    k: 10
    aggr: "max"
    activation: "leakyrelu"
    use_bn: false
    graph_recompute: true
    pooling: "mean"
    classifier_dims: [64, 32]
    dropout: 0.3
